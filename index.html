<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#0f766e"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<meta name="format-detection" content="telephone=no"/>
<title>Pilotage Restaurants</title>
<style>
  :root{
    --brand:#0f766e; --brand-dark:#115e59; --brand-soft:#ccfbf1;
    --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ok:#16a34a; --bad:#dc2626; --gold:#b45309;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45;}
  button{font-family:inherit; touch-action:manipulation; cursor:pointer;}
  .wrap{max-width:680px; margin:0 auto; padding:0 14px calc(30px + env(safe-area-inset-bottom));}
  .hide{display:none !important;}

  .topbar{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;}
  .tb-in{max-width:680px; margin:0 auto; display:flex; align-items:center; gap:10px;}
  .tb-back{border:none; background:var(--brand-soft); color:var(--brand-dark); width:38px; height:38px;
    border-radius:12px; font-size:18px; flex:none;}
  .tb-title{flex:1; min-width:0;}
  .tb-title b{display:block; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-title small{color:var(--muted); font-size:12px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-btn{border:1.5px solid var(--line); background:#fff; border-radius:12px; width:38px; height:38px; font-size:17px; flex:none;}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 14px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; position:sticky; top:calc(66px + env(safe-area-inset-top)); z-index:25;
    background:linear-gradient(var(--bg) 82%, transparent); max-width:708px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabchip{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px;
    font-size:13px; font-weight:600; color:#334155;}
  .tabchip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .tabchip .n{font-size:11px; opacity:.7; margin-left:4px;}

  .navrow{display:flex; gap:8px; overflow-x:auto; padding:10px 14px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navchip{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px;
    font-size:13px; font-weight:700; color:#334155;}
  .navchip.active{background:var(--brand); border-color:var(--brand); color:#fff;}

  .card{background:var(--card); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .card h3{margin:0 0 8px; font-size:15px;}
  .hero{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff; border-radius:18px;
    padding:18px 16px; margin:12px 0; box-shadow:0 4px 14px rgba(15,118,110,.25);}
  .hero .hl{font-size:12.5px; opacity:.85; font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
  .hero .hv{font-size:34px; font-weight:800; line-height:1.15; margin:2px 0 10px;}
  .hero .hgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .hero .hg b{display:block; font-size:16.5px;}
  .hero .hg small{font-size:11.5px; opacity:.85;}

  .restau-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .rcard{background:var(--card); border-radius:14px; padding:12px; box-shadow:0 1px 3px rgba(15,23,42,.07);
    border:1.5px solid transparent; text-align:left;}
  .rcard:active{border-color:var(--brand);}
  .rcard b{display:block; font-size:14.5px; margin-bottom:2px;}
  .rcard .rca{font-size:19px; font-weight:800; color:var(--brand-dark);}
  .rcard .rmeta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .rcard .rev{font-size:12px; font-weight:700;}
  .up{color:var(--ok);} .down{color:var(--bad);}

  .ligne{display:flex; align-items:baseline; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .ligne:last-child{border-bottom:none;}
  .ligne .ll{flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.35;}
  .ligne .lv{font-size:15px; font-weight:800; white-space:nowrap;}
  .ligne .lp{font-size:12px; color:var(--muted); width:52px; text-align:right; white-space:nowrap;}
  .ligne.major{background:#f0fdfa; border-radius:10px; padding:9px 10px; border-bottom:none; margin:3px 0;}
  .ligne.major .ll{font-weight:800; color:var(--brand-dark); text-transform:uppercase; font-size:12.5px;}
  .ligne.major .lv{color:var(--brand-dark);}

  .podium{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:8px 0;}
  .p-item{background:var(--card); border-radius:13px; padding:10px 8px; text-align:center; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .p-item .pn{font-size:22px;}
  .p-item b{display:block; font-size:12px; margin-top:2px; line-height:1.25; min-height:30px;}
  .p-item .pv{font-size:15px; font-weight:800; color:var(--brand-dark);}
  .p-item .pr{font-size:11px; color:var(--muted);}
  .rank{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);}
  .rank:last-child{border-bottom:none;}
  .rank .rn{width:24px; height:24px; border-radius:8px; background:#f1f5f9; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:none;}
  .rank .rl{flex:1; font-size:13.5px; font-weight:600;}
  .rank .rv{font-size:14.5px; font-weight:800; white-space:nowrap;}
  .rank .rr{font-size:11.5px; color:var(--muted); width:56px; text-align:right; white-space:nowrap;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:13px;
    padding:13px 18px; font-size:15px; font-weight:700; min-height:48px;}
  .btn.primary{background:var(--brand); color:#fff;}
  .btn.ghost{background:#fff; color:#334155; border:1.5px solid var(--line);}
  .btn.block{width:100%;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:5px;}
  .field input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px; font-size:16px; font-family:inherit;}
  .meta{color:var(--muted); font-size:12px;}
  .empty{text-align:center; padding:36px 10px; color:var(--muted);}
  .agebar{display:flex; align-items:center; gap:8px; margin:12px 2px 0;}
  .agebar .meta{flex:1;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(28px + env(safe-area-inset-bottom));
    background:#0f172a; color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center;}
  .toast.show{opacity:.96;}
  .spinner{display:inline-block; width:15px; height:15px; border:2px solid rgba(15,23,42,.2); border-top-color:var(--brand);
    border-radius:99px; animation:sp .8s linear infinite; vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60; display:flex;
    align-items:flex-end; justify-content:center;}
  @media (min-width:560px){ .modal-bg{align-items:center; padding:20px;} }
  .sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow:auto;}
  @media (min-width:560px){ .sheet{border-radius:20px;} }
  .sheet h3{margin:0 0 14px; font-size:18px;}
  .toggle{font-size:13px; font-weight:700; color:var(--brand-dark); background:var(--brand-soft);
    border:none; border-radius:10px; padding:9px 13px; margin-top:10px;}
  .gtwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.gt{border-collapse:collapse; width:100%; font-size:12.5px;}
  table.gt th{position:sticky; top:0; background:#f1f5f9; color:#334155; text-align:left;
    padding:7px 9px; border-bottom:2px solid var(--line); white-space:nowrap; font-size:11.5px;}
  table.gt td{padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.gt td.num{white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.gt td.lab{font-weight:600; min-width:110px;}
  table.gt tr.sec td{background:#f0fdfa; color:var(--brand-dark); font-weight:800; text-transform:uppercase; font-size:11.5px;}
  table.gt tr:hover td{background:#f8fafc;}
  @media print{ .noprint{display:none !important;} body{background:#fff;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";

/* ============================ CONFIG ============================ */
const RELAIS_DEFAUT = "https://script.google.com/macros/s/AKfycbzxxGutRsmlzf-Hs9U4U67rHw25dILtLYbeqo-MNjeGSxvqQ_WdPEig7BaV1NLB2zFzhw/exec";

/* ============================ ÉTAT ============================ */
const state = { view:"home", mois:null, resto:null, catClassement:0, vueResto:"synthese",
  colPnl:null, colAnnuel:null, restoCumul:"CONSOLIDE", tout:false };
let cache = { catalogue:null, data:{} };   // {cle, url} + {id:{ts, donnees}}
let catalogue = null;

/* ============================ OUTILS ============================ */
const $ = (s) => document.querySelector(s);
const app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 2400); }
function norm(s){ return String(s == null ? "" : s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’]/g, "'").replace(/\s+/g, " ").trim(); }
function fmtEur(v){
  if(typeof v !== "number" || isNaN(v)) return "—";
  const a = Math.abs(v);
  const o = a >= 1000 ? { maximumFractionDigits:0 } : { minimumFractionDigits:0, maximumFractionDigits:2 };
  return v.toLocaleString("fr-FR", o) + " €";
}
function fmtPct(v){ return (typeof v === "number" && !isNaN(v)) ? (v * 100).toLocaleString("fr-FR", { maximumFractionDigits:1 }) + " %" : "—"; }
function fmtQuand(ts){
  if(!ts) return "";
  const d = new Date(ts), dif = (Date.now() - ts) / 60000;
  if(dif < 1) return "à l'instant";
  if(dif < 60) return "il y a " + Math.round(dif) + " min";
  if(dif < 1440) return "il y a " + Math.round(dif / 60) + " h";
  return "le " + d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
}

/* ---- Cache local (localStorage, avec élagage si quota) ---- */
const LSK = "pilotage:cache:";
function cacheSet(k, v){
  const ecrire = () => localStorage.setItem(LSK + k, JSON.stringify({ ts:Date.now(), d:v }));
  try{ ecrire(); }
  catch(e){
    try{
      const entries = [];
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(key && key.startsWith(LSK)){
          try{ entries.push([key, JSON.parse(localStorage.getItem(key)).ts || 0]); }catch(_){}
        }
      }
      entries.sort((a, b) => a[1] - b[1]);
      entries.slice(0, Math.ceil(entries.length / 2)).forEach(([key]) => localStorage.removeItem(key));
      ecrire();
    }catch(e2){ /* cache indisponible : les données restent affichées */ }
  }
}
function cacheGet(k){
  try{ const s = localStorage.getItem(LSK + k); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}
function cacheDel(k){ try{ localStorage.removeItem(LSK + k); }catch(e){} }
function cacheVider(){
  const keys = [];
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(LSK)) keys.push(key);
  }
  keys.forEach((k) => localStorage.removeItem(k));
}

/* ---- Réglages ---- */
function reglages(){ try{ return JSON.parse(localStorage.getItem("pilotage:reglages") || "{}"); }catch(e){ return {}; } }
function saveReglages(r){ localStorage.setItem("pilotage:reglages", JSON.stringify(r)); }

/* ============================ RELAIS ============================ */
async function appelRelais(params, force){
  const r = reglages();
  const url = r.relay || RELAIS_DEFAUT, cle = r.cle || "";
  if(!cle) throw new Error("CLE_MANQUANTE");
  const full = url + "?cle=" + encodeURIComponent(cle) + (params || "");
  const ck = "req:" + params;
  if(!force){
    const c = cacheGet(ck);
    if(c && (Date.now() - c.ts) < 12 * 3600 * 1000) return c.d;
  }
  const resp = await fetch(full);
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  const data = await resp.json();
  if(data.erreur) throw new Error(data.erreur);
  cacheSet(ck, data);
  return data;
}
const heureDonnees = null;

/* ============================ PARSING ============================ */
const MOIS_TOKENS = [["JANV",1],["JANVIER",1],["FEV",2],["FEVRIER",2],["MARS",3],["AVRIL",4],["MAI",5],["JUIN",6],["JUILLET",7],["AOUT",8],["SEP",9],["OCT",10],["NOV",11],["DEC",12]];
const MOIS_NOMS = [null,"Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function tokenVersMois(tok){
  tok = norm(tok);
  for(const [t, n] of MOIS_TOKENS) if(tok.startsWith(t)) return n;
  return null;
}
function ongletVersMois(nom){
  const m = norm(nom).match(/^SYNTHESE\s+(.+)$/);
  return m ? tokenVersMois(m[1]) : null;
}
function classementVersMois(nom){
  const m = norm(nom).match(/^CLASSEMENT\s+A\s+(?:FIN\s+)?(.+)$/);
  return m ? tokenVersMois(m[1]) : null;
}
function serieExcel(v){
  const d = new Date(Math.round((v - 25569) * 86400000));
  if(isNaN(d)) return String(v);
  return MOIS_NOMS[d.getUTCMonth() + 1] + " " + d.getUTCFullYear();
}
// Colonnes restaurants d'un onglet SYNTHESE : noms en ligne 3 (idx 2), VALEUR c / % c+1
function parseSynthese(grid){
  if(!grid || grid.length < 6) throw new Error("grille synthèse trop courte");
  const noms = grid[2] || [], sous = grid[3] || [];
  const cols = [];
  for(let c = 0; c < noms.length; c++){
    const n = String(noms[c] || "").trim();
    if(!n) continue;
    if(norm(sous[c]) === "VALEUR" || n !== "") cols.push({ nom:n.toUpperCase().replace(/\s+/g," "), val:c, pct:c + 1 });
  }
  // dédoublonner (même nom)
  const vus = new Set(), finaux = [];
  for(const col of cols){ if(!vus.has(col.nom)){ vus.add(col.nom); finaux.push(col); } }
  const lignes = [];
  for(let i = 4; i < grid.length; i++){
    const lab = String((grid[i] || [])[1] ?? "").trim();
    if(!lab) continue;
    const vals = {};
    for(const col of finaux){
      const v = grid[i][col.val], p = grid[i][col.pct];
      vals[col.nom] = { v:(typeof v === "number" ? v : null), p:(typeof p === "number" ? p : null) };
    }
    lignes.push({ lab, vals, idx:i });
  }
  return { cols:finaux, lignes };
}
// PNL MENSUEL : libellés de groupe en ligne 3 (idx 2), sous-en-têtes VALEUR/% en idx 3
function parsePnlMensuel(grid){
  const labs = grid[2] || [], sous = grid[3] || [];
  const cols = [];
  for(let c = 1; c < labs.length; c++){
    let lab = labs[c];
    if(lab === null || lab === undefined || String(lab).trim() === "") continue;
    lab = (typeof lab === "number") ? serieExcel(lab) : String(lab).trim();
    if(norm(sous[c + 1]) !== "%") continue;   // on veut les colonnes VALEUR
    cols.push({ nom:lab, val:c, pct:c + 1 });
  }
  return { cols, lignes:pnlLignes(grid, cols, 4) };
}
// PNL ANNUEL : groupe idx 2 + sous-titre idx 4 (BUDGET/FORECAST/REALISE), sous-en-têtes idx 3
function parsePnlAnnuel(grid){
  const labs = grid[2] || [], sous = grid[4] || [], pct = grid[3] || [];
  const cols = [];
  for(let c = 1; c < labs.length; c++){
    let lab = labs[c];
    if(lab === null || lab === undefined || String(lab).trim() === "") continue;
    lab = (typeof lab === "number") ? serieExcel(lab) : String(lab).trim();
    const s = String((sous[c] ?? "")).trim();
    if(s) lab = lab + " · " + s;
    if(norm(pct[c + 1]) !== "%") continue;
    cols.push({ nom:lab, val:c, pct:c + 1 });
  }
  return { cols, lignes:pnlLignes(grid, cols, 5) };
}
function pnlLignes(grid, cols, debut){
  const lignes = [];
  for(let i = debut; i < grid.length; i++){
    const lab = String((grid[i] || [])[1] ?? "").trim();
    if(!lab || norm(lab).startsWith("SUPERVISEUR")) continue;
    const vals = {};
    for(const col of cols){
      const v = grid[i][col.val], p = grid[i][col.pct];
      vals[col.nom] = { v:(typeof v === "number" ? v : null), p:(typeof p === "number" ? p : null) };
    }
    lignes.push({ lab, vals });
  }
  return lignes;
}
// CLASSEMENT : blocs (nom, valeur, taux) — ligne d'en-tête détectée dynamiquement
function parseClassement(grid){
  let h = 0;
  for(let i = 0; i < Math.min(6, grid.length); i++){
    if((grid[i] || []).some((c) => norm(c) === "RESTAURANT")){ h = i; break; }
  }
  const heads = grid[h] || [];
  const blocs = [];
  for(let c = 0; c < heads.length - 2; c++){
    if(norm(heads[c]) === "RESTAURANT"){
      const titre = [heads[c+1], heads[c+2]].filter(Boolean).join(" — ");
      blocs.push({ titre:titre || "Classement", nom:c, val:c + 1, taux:c + 2 });
      c += 2;
    }
  }
  const donnees = blocs.map((b) => ({ titre:b.titre, items:[] }));
  for(let i = h + 1; i < grid.length; i++){
    const row = grid[i] || [];
    blocs.forEach((b, bi) => {
      const nom = String(row[b.nom] ?? "").trim();
      if(!nom) return;
      donnees[bi].items.push({ nom, v:(typeof row[b.val] === "number" ? row[b.val] : null),
        t:(typeof row[b.taux] === "number" ? row[b.taux] : null) });
    });
  }
  return donnees;
}

/* ---- Lignes clés du P&L ---- */
const CLES_PNL = [
  ["VENTES DE MARCHANDISES"],
  ["COUTS D'ACHAT DES MARCHANDISES VENDUES", "COUT D'ACHAT TOTAL"],
  ["MARGE COMMERCIALE"],
  ["MASSE SALARIALE"],
  ["CHARGES D'EXPLOITATION"],
  ["VALEUR AJOUTE", "VALEUR AJOUTEE"],
  ["EBE"],
  ["RESULTAT EXPLOITATION"],
  ["RESULTAT NET"]
];
function extraireCles(lignes, colNom){
  const out = [], vus = new Set();
  for(const variantes of CLES_PNL){
    for(const l of lignes){
      const nl = norm(l.lab);
      if(variantes.some((v) => nl === v) && !vus.has(nl)){
        vus.add(nl);
        out.push({ lab:l.lab, ...(l.vals[colNom] || { v:null, p:null }) });
        break;
      }
    }
  }
  return out;
}
function ligneCA(lignes, colNom){
  const l = lignes.find((x) => norm(x.lab) === "VENTES DE MARCHANDISES");
  return l ? (l.vals[colNom] || { v:null, p:null }) : { v:null, p:null };
}

/* ============================ ACCÈS DONNÉES ============================ */
async function getCatalogue(force){
  if(catalogue && !force) return catalogue;
  const d = await appelRelais("&liste=1", force);
  catalogue = d.classeurs;
  return catalogue;
}
async function getOnglets(classeur, onglets, force){
  if(!onglets.length) return {};
  const d = await appelRelais("&classeur=" + encodeURIComponent(classeur) + "&onglet=" + encodeURIComponent(onglets.join("|")), force);
  return d.onglets || {};
}
function moisDisponibles(cat){
  return cat.SYNTHESE.onglets
    .map(ongletVersMois).filter((m) => m).sort((a, b) => a - b);
}
function ongletSynthese(cat, mois){
  return cat.SYNTHESE.onglets.find((n) => ongletVersMois(n) === mois) || null;
}
function ongletsClassement(cat, mois){
  const cands = cat.SYNTHESE.onglets.filter((n) => classementVersMois(n) === mois);
  return cands.sort((a, b) => (norm(a).includes("FIN") ? 1 : 0) - (norm(b).includes("FIN") ? 1 : 0));
}
const CODE_VILLE = { ATLANTA:"Langueux", BOSTON:"Rennes", COLUMBIA:"Brétigny", DALLAS:"Chambray",
  ELVIS:"Tours", MIAMI:"Dijon", "NEW YORK":"Arras", ORLANDO:"Vannes", PHILADELPHIE:"Plaisir", PHOENIX:"Saran", CONSOLIDE:"Consolidé" };
function nomResto(code){
  const cl = CODE_VILLE[code];
  return code.charAt(0) + code.slice(1).toLowerCase() + (cl && cl !== "Consolidé" ? " — " + cl : "");
}
function ongletPnlMensuel(onglets){
  return onglets.find((n) => norm(n) === "PNL MENSUEL") || onglets.find((n) => norm(n) === "PNL MENSUEL 2025") || null;
}

/* ============================ RENDU ============================ */
function topbar(titre, sous, actions){
  return `<div class="topbar noprint"><div class="tb-in">
    ${state.view !== "home" ? `<button class="tb-back" data-action="nav" data-v="home">←</button>` : `<button class="tb-back" data-action="nav" data-v="settings">⚙️</button>`}
    <div class="tb-title"><b>${esc(titre)}</b><small>${esc(sous || "")}</small></div>
    ${actions || ""}
    <button class="tb-btn" data-action="refresh" title="Rafraîchir">⟳</button>
  </div></div>`;
}
function navTabs(){
  const mois = state.moisDispo || [];
  return `<div class="tabs noprint">${mois.map((m) =>
    `<button class="tabchip ${m === state.mois ? "active" : ""}" data-action="mois" data-m="${m}">${MOIS_NOMS[m]}</button>`).join("")}</div>`;
}
function ligneHtml(l, forte){
  const val = (typeof l.v === "number") ? fmtEur(l.v) : (l.v ?? "—");
  return `<div class="ligne ${forte ? "major" : ""}">
    <span class="ll">${esc(l.lab)}</span>
    <span class="lv">${esc(val)}</span>
    <span class="lp">${fmtPct(l.p)}</span></div>`;
}
function tableauCles(cles){
  if(!cles.length) return `<div class="empty">Aucune donnée</div>`;
  return `<div>${cles.map((l, i) => ligneHtml(l, i === 0)).join("")}</div>`;
}

async function render(){
  const r = reglages();
  if(!r.cle){ renderOnboarding(); return; }
  try{
    if(state.view === "home") await renderHome();
    else if(state.view === "classement") await renderClassement();
    else if(state.view === "resto") await renderResto();
    else if(state.view === "cumul") await renderCumul();
    else if(state.view === "graph") await renderGraphiques();
    else if(state.view === "settings") renderSettings();
  }catch(e){
    app.innerHTML = topbar("Pilotage Restaurants") + `<div class="wrap">
      <div class="card"><h3>⚠️ ${esc(e.message === "CLE_MANQUANTE" ? "Clé manquante" : "Erreur de chargement")}</h3>
      <p class="meta">${esc(String(e.message || e))}</p>
      <button class="btn ghost block" data-action="nav" data-v="settings">Ouvrir les réglages</button>
      <button class="btn primary block" data-action="refresh" style="margin-top:8px;">Réessayer</button></div></div>`;
  }
}

/* ---------- Accueil ---------- */
async function renderHome(){
  const cat = await getCatalogue();
  if(!cat.SYNTHESE) throw new Error("Classeur SYNTHESE introuvable dans le relais");
  const mois = moisDisponibles(cat);
  if(!state.mois) state.mois = mois[mois.length - 1];
  state.moisDispo = mois;
  const os = ongletSynthese(cat, state.mois);
  const syn = await getOnglets("SYNTHESE", [os]);
  const grid = syn[os];
  if(!grid) throw new Error("Onglet synthèse vide");
  const S = parseSynthese(grid);
  const conso = "CONSOLIDE";
  const cles = extraireCles(S.lignes, conso);
  const ca = ligneCA(S.lignes, conso);
  const marge = cles.find((l) => norm(l.lab) === "MARGE COMMERCIALE") || {};
  const ebe = cles.find((l) => norm(l.lab) === "EBE") || {};
  const rex = cles.find((l) => norm(l.lab) === "RESULTAT EXPLOITATION") || {};

  // évolution par restaurant depuis le classement
  let evol = {};
  try{
    const candsC = ongletsClassement(cat, state.mois);
    if(candsC.length){
      const cl = await getOnglets("SYNTHESE", [candsC[0]]);
      const blocs = parseClassement(cl[candsC[0]] || []);
      if(blocs[0]) blocs[0].items.forEach((it) => { evol[norm(it.nom).split(" ")[0]] = it.t; });
    }
  }catch(e){}

  const restos = S.cols.filter((c) => c.nom !== "CONSOLIDE");
  const cards = restos.map((c) => {
    const d = ligneCA(S.lignes, c.nom);
    const ev = evol[c.nom];
    const part = (typeof d.v === "number" && ca.v) ? d.v / ca.v : null;
    return `<button class="rcard" data-action="resto" data-code="${esc(c.nom)}">
      <b>${esc(c.nom.charAt(0) + c.nom.slice(1).toLowerCase())}${CODE_VILLE[c.nom] ? `<span class="meta" style="font-weight:600;"> · ${esc(CODE_VILLE[c.nom])}</span>` : ""}</b>
      <span class="rca">${fmtEur(d.v)}</span>
      <div class="rmeta">Part du groupe : ${fmtPct(part)} ${typeof ev === "number" ? `· <span class="${ev >= 0 ? "up" : "down"}">${ev >= 0 ? "▲" : "▼"} ${fmtPct(Math.abs(ev))}</span>` : ""}</div>
    </button>`;
  }).join("");

  app.innerHTML = topbar("Pilotage Restaurants", MOIS_NOMS[state.mois] + " " + new Date().getFullYear()) + navTabs() + `
  <div class="wrap">
    <div class="agebar"><span class="meta" id="ageInfo"></span></div>
    <div class="hero">
      <div class="hl">CA consolidé — ${MOIS_NOMS[state.mois]}</div>
      <div class="hv">${fmtEur(ca.v)}</div>
      <div class="hgrid">
        <div class="hg"><b>${fmtEur(marge.v)}</b><small>Marge commerciale (${fmtPct(marge.p)})</small></div>
        <div class="hg"><b>${fmtEur(ebe.v)}</b><small>EBE (${fmtPct(ebe.p)})</small></div>
        <div class="hg"><b>${fmtEur(rex.v)}</b><small>Rés. exploitation (${fmtPct(rex.p)})</small></div>
      </div>
    </div>
    <div class="card">
      <h3>Indicateurs consolidés</h3>
      ${tableauCles(cles)}
    </div>
    <div class="card"><h3>CA par restaurant — ${MOIS_NOMS[state.mois]}</h3><div id="chartHome"></div></div>
    <h3 style="margin:16px 2px 4px;">Les restaurants <span class="meta">— touchez pour le détail</span></h3>
    <div class="restau-grid">${cards}</div>
    <button class="btn ghost block" data-action="nav" data-v="classement" style="margin-top:14px;">🏆 Voir les classements</button>
    <button class="btn ghost block" data-action="nav" data-v="cumul" style="margin-top:8px;">📅 Cumul de l'année</button>
    <button class="btn ghost block" data-action="nav" data-v="graph" style="margin-top:8px;">📈 Graphiques d'évolution</button>
  </div>`;
  const barresHome = restos.map((c) => ({ label:c.nom.charAt(0) + c.nom.slice(1).toLowerCase(), val:(ligneCA(S.lignes, c.nom) || {}).v }))
    .filter((x) => typeof x.val === "number").sort((a, b) => b.val - a.val);
  const ch = document.getElementById("chartHome");
  if(ch) ch.innerHTML = svgBarresH(barresHome, fmtEur);
  majAge();
}
function majAge(){
  const el = $("#ageInfo");
  if(!el) return;
  const c = cacheGet("req:&liste=1");
  el.textContent = c ? "Données actualisées " + fmtQuand(c.ts) : "Jamais actualisé";
}

/* ---------- Classements ---------- */
async function renderClassement(){
  const cat = await getCatalogue();
  if(!state.mois) state.mois = moisDisponibles(cat).pop();
  state.moisDispo = moisDisponibles(cat);
  const cands = ongletsClassement(cat, state.mois);
  let blocs = null;
  for(const n of cands){
    const cl = await getOnglets("SYNTHESE", [n]);
    const p = parseClassement(cl[n] || []);
    if(p.length && p.some((b) => b.items.length)){ blocs = p; break; }
  }
  if(!blocs) throw new Error("Aucun classement pour " + MOIS_NOMS[state.mois]);
  if(state.catClassement >= blocs.length) state.catClassement = 0;
  const b = blocs[state.catClassement];
  const top3 = b.items.slice(0, 3);
  const icones = ["🥇", "🥈", "🥉"];
  const estCa = /CA /i.test(b.titre);
  app.innerHTML = topbar("Classements", MOIS_NOMS[state.mois]) + `
  <div class="navrow noprint">${blocs.map((x, i) =>
    `<button class="navchip ${i === state.catClassement ? "active" : ""}" data-action="cat" data-i="${i}">${esc(x.titre.split("—")[0].trim())}</button>`).join("")}</div>
  <div class="wrap">
    <div class="podium">${top3.map((it, i) => `<div class="p-item"><div class="pn">${icones[i]}</div>
      <b>${esc(it.nom)}</b><div class="pv">${fmtEur(it.v)}</div>
      <div class="pr">${typeof it.t === "number" ? (estCa ? `<span class="${it.t >= 0 ? "up" : "down"}">${it.t >= 0 ? "▲" : "▼"} ${fmtPct(Math.abs(it.t))}</span>` : fmtPct(it.t)) : ""}</div></div>`).join("")}</div>
    <div class="card">
      <h3>${esc(b.titre)}</h3>
      ${b.items.map((it, i) => `<div class="rank"><span class="rn">${i + 1}</span>
        <span class="rl">${esc(it.nom)}</span>
        <span class="rv">${fmtEur(it.v)}</span>
        <span class="rr">${typeof it.t === "number" ? (estCa ? `<span class="${it.t >= 0 ? "up" : "down"}">${it.t >= 0 ? "▲" : "▼"} ${fmtPct(Math.abs(it.t))}</span>` : fmtPct(it.t)) : ""}</span></div>`).join("")}
    </div>
  </div>`;
}

/* ---------- Fiche restaurant ---------- */
const VILLES_VERS_CODE = { LANGUEUX:"ATLANTA", RENNES:"BOSTON", BRETIGNY:"COLUMBIA", CHAMBRAY:"DALLAS",
  TOURS:"ELVIS", DIJON:"MIAMI", ARRAS:"NEW YORK", PLAISIR:"PHILADELPHIE", SARAN:"PHOENIX" };
async function renderResto(){
  const cat = await getCatalogue();
  const code = state.resto;
  const classeur = Object.keys(VILLES_VERS_CODE).find((v) => VILLES_VERS_CODE[v] === code);
  if(!classeur){ throw new Error("Pas de détail disponible pour " + code); }
  const catR = cat[classeur];
  if(!catR) throw new Error("Classeur " + classeur + " introuvable");
  const ongM = ongletPnlMensuel(catR.onglets);
  const ongA = catR.onglets.find((n) => norm(n) === "PNL ANNUEL");
  const d = await getOnglets(classeur, [ongM, ongA].filter(Boolean));

  // Synthèse du mois pour ce restaurant
  const os = ongletSynthese(cat, state.mois || moisDisponibles(cat).pop());
  const syn = await getOnglets("SYNTHESE", [os]);
  const S = parseSynthese(syn[os]);
  const colSyn = S.cols.find((c) => c.nom === code);
  const clesSyn = colSyn ? extraireCles(S.lignes, colSyn.nom) : [];

  let blocMensuel = "", blocAnnuel = "", blocBVR = "", A = null;
  if(ongM && d[ongM]){
    const P = parsePnlMensuel(d[ongM]);
    if(!state.colPnl || !P.cols.some((c) => c.nom === state.colPnl)) state.colPnl = P.cols[0].nom;
    blocMensuel = blocPnlParam("PNL mensuel", P, state.colPnl, "colpnl");
  }
  if(ongA && d[ongA]){
    A = parsePnlAnnuel(d[ongA]);
    if(!state.colAnnuel || !A.cols.some((c) => c.nom === state.colAnnuel)) state.colAnnuel = A.cols.find((c) => /REALISE/.test(c.nom))?.nom || A.cols[0].nom;
    const cles = extraireCles(A.lignes, state.colAnnuel);
    const ligneVentes = A.lignes.find((x) => norm(x.lab) === "VENTES DE MARCHANDISES");
    const barresAn = A.cols.map((c) => ({
      label:c.nom.replace("CUMUL A DATE ", "CUM. ").replace("Total ", "").replace("MENSUEL ", "Mens. "),
      val:ligneVentes ? (ligneVentes.vals[c.nom] || {}).v : null
    })).filter((x) => typeof x.val === "number");
    blocAnnuel = `
      <div class="navrow noprint">${A.cols.map((c) =>
        `<button class="navchip ${c.nom === state.colAnnuel ? "active" : ""}" data-action="colannuel" data-c="${esc(c.nom)}">${esc(c.nom)}</button>`).join("")}</div>
      <div class="card"><h3>Historique annuel — ${esc(state.colAnnuel)}</h3>${tableauCles(cles)}</div>
      <div class="card"><h3>CA par année et scénario</h3>${svgBarresH(barresAn, fmtEur)}</div>`;
    // Comparaison Réalisé vs Budget
    const annees = [...new Set(A.cols.map((c) => (norm(c.nom).match(/(20\d\d)/) || [])[1]).filter(Boolean))];
    const annee = state.bvrAnnee && annees.includes(state.bvrAnnee) ? state.bvrAnnee
      : (annees.includes(String(new Date().getFullYear())) ? String(new Date().getFullYear()) : annees[0]);
    const col = (re) => A.cols.find((c) => re.test(norm(c.nom)));
    const cB = col(new RegExp("CUMUL A DATE " + annee + ".*BUDGET")) || col(new RegExp("TOTAL " + annee + ".*BUDGET"));
    const cF = col(new RegExp("TOTAL " + annee + ".*FORECAST"));
    const cR = col(new RegExp("CUMUL A DATE " + annee + ".*REALISE")) || col(new RegExp("TOTAL " + annee + ".*REALISE"));
    if(cB || cR || cF){
      const v = (l, c) => (c && l.vals[c.nom]) ? l.vals[c.nom].v : null;
      const lignesCles = [];
      const vus = new Set();
      for(const variantes of CLES_PNL){
        for(const l of A.lignes){
          const nl = norm(l.lab);
          if(variantes.some((vv) => nl === vv) && !vus.has(nl)){ vus.add(nl); lignesCles.push(l); break; }
        }
      }
      const cell = (x) => `<td class="num">${typeof x === "number" ? fmtEur(x) : "—"}</td>`;
      const lignesHtml = lignesCles.map((l) => {
        const b = v(l, cB), f = v(l, cF), r = v(l, cR);
        const ecart = (typeof r === "number" && typeof b === "number") ? r - b : null;
        const epct = (ecart !== null && b) ? ecart / Math.abs(b) : null;
        const ecartHtml = ecart === null ? "—" : `<span class="${ecart >= 0 ? "up" : "down"}">${ecart >= 0 ? "+" : "−"}${fmtEur(Math.abs(ecart))}</span>`;
        const pctHtml = epct === null ? "—" : `<span class="${epct >= 0 ? "up" : "down"}">${epct >= 0 ? "+" : "−"}${fmtPct(Math.abs(epct))}</span>`;
        return `<tr class="${norm(l.lab) === "VENTES DE MARCHANDISES" ? "sec" : ""}"><td class="lab">${esc(l.lab)}</td>${cell(b)}${cF ? cell(f) : ""}${cell(r)}<td class="num">${ecartHtml}</td><td class="num">${pctHtml}</td></tr>`;
      }).join("");
      blocBVR = `
        <div class="navrow noprint">${annees.map((a) =>
          `<button class="navchip ${a === annee ? "active" : ""}" data-action="anneedelta" data-a="${a}">${a}</button>`).join("")}</div>
        <div class="card" style="padding:10px;"><div class="gtwrap"><table class="gt">
          <thead><tr><th>Ligne</th><th>Budget</th>${cF ? "<th>Forecast</th>" : ""}<th>Réalisé</th><th>Écart R/B</th><th>Écart %</th></tr></thead>
          <tbody>${lignesHtml}</tbody></table></div>
          <p class="meta" style="margin:8px 2px 0;">Écart = Réalisé − Budget (cumul à date ${annee}). Vert : au-dessus du budget, rouge : en dessous.</p></div>`;
    }
  }

  // Sections supplémentaires : budgets, atterrissage/SIG, contrats, organigrammes, immo, suivi
  const secs = sectionsExtras(catR.onglets);
  let blocExtra = "";
  if(state.extra && secs[state.extra.sec]){
    const sec = secs[state.extra.sec];
    if(state.extra.tab >= sec.tabs.length) state.extra.tab = 0;
    const nomTab = sec.tabs[state.extra.tab];
    const d2 = await getOnglets(classeur, [nomTab]);
    const g = d2[nomTab];
    if(!g){
      blocExtra = `<div class="card"><h3>${esc(nomTab)}</h3><div class="empty">Onglet vide</div></div>`;
    } else if(sec.type === "pnl" || (sec.type === "att" && !norm(nomTab).startsWith("SIG"))){
      const P = parsePnlMensuel(g);
      if(P.cols.length){
        if(!state.extra.col || !P.cols.some((c) => c.nom === state.extra.col)) state.extra.col = P.cols[0].nom;
        blocExtra = blocPnlParam(nomTab, P, state.extra.col, "colextra");
      } else blocExtra = `<div class="card"><h3>${esc(nomTab)}</h3>${tableGenerique(g)}</div>`;
    } else if(sec.type === "att"){
      const T = parseTableColonnes(g, 0, 1);
      if(T.cols.length && extraireCles(T.lignes, T.cols[0].nom).length){
        if(!state.extra.col || !T.cols.some((c) => c.nom === state.extra.col)) state.extra.col = T.cols[0].nom;
        const cles = extraireCles(T.lignes, state.extra.col);
        blocExtra = `<div class="navrow noprint">${T.cols.map((c) =>
          `<button class="navchip ${c.nom === state.extra.col ? "active" : ""}" data-action="colextra" data-c="${esc(c.nom)}">${esc(c.nom)}</button>`).join("")}</div>
          <div class="card"><h3>${esc(nomTab)} — ${esc(state.extra.col)}</h3>${tableauCles(cles)}</div>`;
      } else blocExtra = `<div class="card"><h3>${esc(nomTab)}</h3>${tableGenerique(g)}</div>`;
    } else {
      blocExtra = `<div class="card"><h3>${esc(nomTab)}</h3>${tableGenerique(g)}</div>`;
    }
  }

  const sous = state.vueResto;
  app.innerHTML = topbar(nomResto(code), MOIS_NOMS[state.mois] || "") + `
  <div class="navrow noprint">
    <button class="navchip ${sous === "synthese" ? "active" : ""}" data-action="vueresto" data-v="synthese">Mois en cours</button>
    ${blocMensuel ? `<button class="navchip ${sous === "mensuel" ? "active" : ""}" data-action="vueresto" data-v="mensuel">PNL mensuel</button>` : ""}
    ${blocAnnuel ? `<button class="navchip ${sous === "annuel" ? "active" : ""}" data-action="vueresto" data-v="annuel">Historique</button>` : ""}
    ${A ? `<button class="navchip ${sous === "bvr" ? "active" : ""}" data-action="vueresto" data-v="bvr">Réalisé vs Budget</button>` : ""}
    ${secs.map((s, i) => `<button class="navchip ${state.extra && state.extra.sec === i && sous === "extra" ? "active" : ""}" data-action="extra" data-i="${i}">${esc(s.label)}</button>`).join("")}
  </div>
  <div class="wrap">
    ${sous === "synthese" ? `<div class="card"><h3>Synthèse — ${esc(MOIS_NOMS[state.mois])}</h3>${tableauCles(clesSyn)}</div>` : ""}
    ${sous === "mensuel" ? blocMensuel : ""}
    ${sous === "annuel" ? blocAnnuel : ""}
    ${sous === "bvr" ? (blocBVR || `<div class="card"><div class="empty">Comparaison indisponible pour ce restaurant</div></div>`) : ""}
    ${sous === "extra" ? (blocExtra || `<div class="card"><div class="empty">Choisissez une section ci-dessus</div></div>`) : ""}
    ${sous === "extra" && state.extra ? `<div class="navrow noprint">${secs[state.extra.sec].tabs.map((t, j) =>
      `<button class="navchip ${state.extra.tab === j ? "active" : ""}" data-action="extratab" data-t="${j}">${esc(t)}</button>`).join("")}</div>` : ""}
  </div>`;
}

      <h3>Données</h3>
      <p class="meta">Les données sont mises en cache sur l'appareil et rafraîchies à l'ouverture (ou via le bouton ⟳). L'application reste consultable hors connexion avec le dernier cache.</p>
      <button class="btn ghost block" data-action="clear-cache" style="margin-top:8px;">🧹 Vider le cache local</button>
    </div>
  </div>`;
}

/* ---- Onglets supplémentaires (budgets, atterrissage, SIG, contrats, organigrammes...) ---- */
function sectionsExtras(onglets){
  const has = (pred) => onglets.filter(pred);
  const secs = [];
  const budgets = has((n) => norm(n).startsWith("BUDGET"));
  if(budgets.length) secs.push({ id:"budget", label:"Budgets", tabs:budgets, type:"pnl" });
  const att = has((n) => norm(n).startsWith("ATTERRISSAGE") || norm(n).startsWith("SIG"));
  if(att.length) secs.push({ id:"att", label:"Atterrissage & SIG", tabs:att, type:"att" });
  const cont = has((n) => norm(n).includes("CONTRAT"));
  if(cont.length) secs.push({ id:"contrats", label:"Contrats", tabs:cont, type:"table" });
  const orgs = has((n) => norm(n).startsWith("ORGANIGRAMME"));
  if(orgs.length) secs.push({ id:"orga", label:"Organigrammes", tabs:orgs, type:"table" });
  const immo = has((n) => norm(n).includes("IMMO"));
  if(immo.length) secs.push({ id:"immo", label:"Immobilier", tabs:immo, type:"table" });
  const suivi = has((n) => norm(n).startsWith("SUIVI"));
  if(suivi.length) secs.push({ id:"suivi", label:"Suivi", tabs:suivi, type:"table" });
  return secs;
}
function blocPnlParam(titre, P, colSel, action){
  const cles = extraireCles(P.lignes, colSel);
  return `<div class="navrow noprint">${P.cols.map((c) =>
    `<button class="navchip ${c.nom === colSel ? "active" : ""}" data-action="${action}" data-c="${esc(c.nom)}">${esc(c.nom)}</button>`).join("")}</div>
  <div class="card"><h3>${esc(titre)} — ${esc(colSel)}</h3>${tableauCles(cles)}
  <button class="toggle" data-action="tout">Afficher toutes les lignes</button>
  <div id="toutes" class="${state.tout ? "" : "hide"}">${tableauCles(P.lignes.map((l) => ({ lab:l.lab, ...(l.vals[colSel] || {}) })))}</div></div>`;
}
function parseTableColonnes(grid, headerIdx, labelCol){
  const heads = grid[headerIdx] || [];
  const cols = [];
  heads.forEach((hh, c) => {
    if(c === labelCol) return;
    const nom = String(hh ?? "").trim();
    if(nom) cols.push({ nom, val:c });
  });
  const lignes = [];
  for(let i = headerIdx + 1; i < grid.length; i++){
    const lab = String((grid[i] || [])[labelCol] ?? "").trim();
    if(!lab) continue;
    const vals = {};
    cols.forEach((c) => { const v = grid[i][c.val]; vals[c.nom] = { v:(typeof v === "number" ? v : null), p:null }; });
    lignes.push({ lab, vals });
  }
  return { cols, lignes };
}
function fmtCellule(v){
  if(v === null || v === undefined || v === "") return "";
  if(typeof v === "string" && /^-?\d{1,15}([.,]\d+)?$/.test(v.trim())){
    try{ v = parseFloat(v.replace(",", ".")); }catch(e){ /* garde la chaîne */ }
  }
  if(typeof v === "number"){
    if(Math.abs(v) < 1.5 && !Number.isInteger(v)) return fmtPct(v);
    if(Math.abs(v) >= 1000) return fmtEur(v);
    return v.toLocaleString("fr-FR", { maximumFractionDigits:2 });
  }
  const s = String(v);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3] + "/" + m[2] + "/" + m[1];
  return s;
}
function tableGenerique(grid){
  let h = -1;
  for(let i = 0; i < Math.min(8, grid.length); i++){
    const row = grid[i] || [];
    const pleines = row.filter((c) => String(c ?? "").trim() !== "");
    if(pleines.length >= 3 && pleines.every((c) => typeof c === "string" || c instanceof Date === false && typeof c === "string")){ h = i; break; }
  }
  const used = new Set();
  grid.forEach((row, i) => {
    if(h >= 0 && i <= h) return;
    (row || []).forEach((c, j) => { if(String(c ?? "").trim() !== "") used.add(j); });
  });
  const cols = [...used].sort((a, b) => a - b);
  const head = h >= 0 ? grid[h] : null;
  let avant = "";
  if(h > 0){
    const t = grid.slice(0, h).map((r) => (r || []).filter((c) => String(c ?? "").trim() !== "").map((c) => fmtCellule(c)).join(" · ")).filter(Boolean).join(" — ");
    if(t) avant = `<p class="meta" style="margin:4px 0 8px;">${esc(t)}</p>`;
  }
  let html = avant + `<div class="gtwrap"><table class="gt"><thead><tr>`;
  html += cols.map((c) => {
    const t = head && String(head[c] ?? "").trim();
    return `<th>${esc(t || "Col. " + (c + 1))}</th>`;
  }).join("");
  html += `</tr></thead><tbody>`;
  grid.forEach((row, i) => {
    if(i === h) return;
    const cells = cols.map((c) => String(row ? (row[c] ?? "") : "").trim() !== "" ? fmtCellule(row[c]) : "");
    if(cells.every((x) => x === "")) return;
    const section = cells.slice(1).every((x) => x === "");
    html += `<tr class="${section ? "sec" : ""}">${cells.map((x, k) => `<td class="${k === 0 ? "lab" : "num"}">${x}</td>`).join("")}</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

/* ---- Graphiques SVG (sans dépendance) ---- */
function svgBarresH(items, fmt){
  items = items.filter((x) => typeof x.val === "number");
  if(!items.length) return `<div class="empty">Pas de données</div>`;
  const max = Math.max(...items.map((i) => Math.abs(i.val)), 1);
  const rowH = 30, w = 620, labelW = 118;
  const h = items.length * rowH + 6;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;" role="img" aria-label="barres">`;
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    const bw = Math.max(2, Math.abs(it.val) / max * (w - labelW - 96));
    const couleur = it.val < 0 ? "#dc2626" : "#0f766e";
    s += `<text x="${labelW - 6}" y="${y + 15}" text-anchor="end" font-size="11.5" fill="currentColor">${esc(it.label)}</text>`;
    s += `<rect x="${labelW}" y="${y + 3}" width="${bw}" height="18" rx="4" fill="${couleur}" opacity=".85"></rect>`;
    s += `<text x="${labelW + bw + 6}" y="${y + 17}" font-size="11.5" font-weight="700" fill="currentColor">${fmt(it.val)}</text>`;
  });
  return s + "</svg>";
}
function svgLigne(serie, fmt){
  const pts = serie.filter((p) => typeof p.val === "number");
  if(pts.length < 2) return `<div class="empty">Pas assez de mois pour tracer une courbe.</div>`;
  const vals = pts.map((p) => p.val);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const marge = (max - min) * 0.14; min -= marge; max += marge;
  const w = 640, hh = 250, mL = 80, mR = 18, mT = 20, mB = 36;
  const xi = (i) => mL + (i * (w - mL - mR)) / Math.max(1, serie.length - 1);
  const yi = (v) => mT + (1 - (v - min) / (max - min)) * (hh - mT - mB);
  let path = "", started = false;
  serie.forEach((p, i) => {
    if(typeof p.val !== "number"){ started = false; return; }
    path += (started ? " L" : " M") + xi(i).toFixed(1) + " " + yi(p.val).toFixed(1);
    started = true;
  });
  const grille = [0, 0.5, 1].map((t) => {
    const v = min + (max - min) * (1 - t);
    return `<line x1="${mL}" x2="${w - mR}" y1="${yi(v).toFixed(1)}" y2="${yi(v).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"></line>
      <text x="${mL - 6}" y="${(yi(v) + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#64748b">${fmt(v)}</text>`;
  }).join("");
  const points = serie.map((p, i) => typeof p.val === "number"
    ? `<circle cx="${xi(i).toFixed(1)}" cy="${yi(p.val).toFixed(1)}" r="4" fill="#0f766e"></circle>
       <text x="${xi(i).toFixed(1)}" y="${hh - 14}" text-anchor="middle" font-size="10.5" fill="#64748b">${esc(p.label)}</text>` : "").join("");
  const dernier = pts[pts.length - 1];
  const idxD = serie.indexOf(dernier);
  const etiq = `<text x="${Math.min(xi(idxD), w - mR - 4).toFixed(1)}" y="${Math.max(yi(dernier.val) - 10, mT + 8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">${fmt(dernier.val)}</text>`;
  return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:auto;" role="img" aria-label="courbe">${grille}
    <path d="${path}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"></path>${points}${etiq}</svg>`;
}

/* ---- Vue Graphiques : évolution mensuelle ---- */
const METRIQUES_GRAPH = [
  { id:"VENTES", label:"CA", key:"VENTES DE MARCHANDISES" },
  { id:"MARGE", label:"Marge comm.", key:"MARGE COMMERCIALE" },
  { id:"EBE", label:"EBE", key:"EBE" },
  { id:"RESULTAT", label:"Rés. exploitation", key:"RESULTAT EXPLOITATION" }
];
async function renderGraphiques(){
  const cat = await getCatalogue();
  const mois = moisDisponibles(cat);
  const ongs = mois.map((m) => ongletSynthese(cat, m)).filter(Boolean);
  if(!ongs.length) throw new Error("Aucune synthèse mensuelle");
  let series = cacheGet("graph:series:v1");
  if(state.graphForce){ series = null; state.graphForce = false; }
  if(!series || !series.parCode){
    toast("Chargement de tous les mois… (20 à 40 s au premier affichage)");
    const donnees = await getOnglets("SYNTHESE", ongs, true);
    const S0 = parseSynthese(donnees[ongs[0]]);
    const parCode = {};
    S0.cols.forEach((c) => { parCode[c.nom] = {}; });
    METRIQUES_GRAPH.forEach((m) => {
      S0.cols.forEach((c) => { parCode[c.nom][m.id] = []; });
    });
    ongs.forEach((n, i) => {
      const S = parseSynthese(donnees[n]);
      S0.cols.forEach((c) => {
        const colS = S.cols.find((x) => x.nom === c.nom);
        METRIQUES_GRAPH.forEach((m) => {
          let v = null;
          if(colS){
            const l = S.lignes.find((x) => norm(x.lab) === m.key);
            v = l ? (l.vals[c.nom] || {}).v ?? null : null;
          }
          parCode[c.nom][m.id].push(v);
        });
      });
    });
    series = { parCode, labels: ongs.map((n, i) => (MOIS_NOMS[mois[i]] || "?").slice(0, 4) + ".") };
    cacheSet("graph:series:v1", series);
  }
  if(!state.graph) state.graph = { met:"VENTES", code:"CONSOLIDE" };
  if(!series.parCode[state.graph.code]) state.graph.code = "CONSOLIDE";
  const met = METRIQUES_GRAPH.find((m) => m.id === state.graph.met) || METRIQUES_GRAPH[0];
  const serie = series.labels.map((lab, i) => ({ label:lab, val:series.parCode[state.graph.code][met.id][i] }));
  const fmt = (v) => fmtEur(v);
  const dernierMois = series.labels[series.labels.length - 1];
  const barres = Object.keys(series.parCode).filter((c) => c !== "CONSOLIDE")
    .map((c) => ({ label:c.charAt(0) + c.slice(1).toLowerCase(), val:series.parCode[c][met.id][series.labels.length - 1] }))
    .filter((x) => typeof x.val === "number").sort((a, b) => b.val - a.val);
  app.innerHTML = topbar("Graphiques", "Évolution " + (series.labels[0] || "") + " → " + dernierMois) + `
  <div class="wrap">
    <div class="navrow noprint">${METRIQUES_GRAPH.map((m) =>
      `<button class="navchip ${m.id === met.id ? "active" : ""}" data-action="gmet" data-m="${m.id}">${esc(m.label)}</button>`).join("")}</div>
    <div class="navrow noprint">${Object.keys(series.parCode).map((c) =>
      `<button class="navchip ${c === state.graph.code ? "active" : ""}" data-action="gcode" data-c="${esc(c)}">${esc(c.charAt(0) + c.slice(1).toLowerCase())}</button>`).join("")}</div>
    <div class="card"><h3>${esc(met.label)} — ${esc(nomResto(state.graph.code))}</h3>${svgLigne(serie, fmt)}</div>
    <div class="card"><h3>${esc(met.label)} par restaurant — ${esc(dernierMois)}</h3>${svgBarresH(barres, fmt)}</div>
  </div>`;
}

/* ============================ ACTIONS ============================ */
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;
  if(a === "nav"){ state.view = el.dataset.v; state.tout = false; render(); }
  else if(a === "mois"){ state.mois = parseInt(el.dataset.m, 10); state.tout = false; render(); }
  else if(a === "resto"){ state.resto = el.dataset.code; state.view = "resto"; state.vueResto = "synthese"; state.tout = false; state.extra = null; render(); }
  else if(a === "cat"){ state.catClassement = parseInt(el.dataset.i, 10); render(); }
  else if(a === "vueresto"){ state.vueResto = el.dataset.v; state.tout = false; state.extra = null; render(); }
  else if(a === "colpnl"){ state.colPnl = el.dataset.c; state.tout = false; render(); }
  else if(a === "colannuel"){ state.colAnnuel = el.dataset.c; render(); }
  else if(a === "cumulcol"){ state.restoCumul = el.dataset.c; render(); }
  else if(a === "tout"){
    state.tout = !state.tout;
    const b = app.querySelector("[data-action='tout']");
    if(b) b.textContent = state.tout ? "Masquer le détail" : "Afficher toutes les lignes";
    const d = app.querySelector("#toutes");
    if(d) d.classList.toggle("hide", !state.tout);
  }
  else if(a === "extra"){
    state.extra = { sec:parseInt(el.dataset.i, 10), tab:0, col:null };
    state.vueResto = "extra"; state.tout = false; render();
  }
  else if(a === "extratab"){ if(state.extra){ state.extra.tab = parseInt(el.dataset.t, 10); state.extra.col = null; state.tout = false; render(); } }
  else if(a === "colextra"){ if(state.extra){ state.extra.col = el.dataset.c; state.tout = false; render(); } }
  else if(a === "anneedelta"){ state.bvrAnnee = el.dataset.a; render(); }
  else if(a === "gmet"){ state.graph = state.graph || {}; state.graph.met = el.dataset.m; render(); }
  else if(a === "gcode"){ state.graph = state.graph || {}; state.graph.code = el.dataset.c; render(); }
  else if(a === "refresh"){ refresh(); }
  else if(a === "save-reglages"){
    const cle = $("#fCle").value.trim(), relay = $("#fRelais").value.trim() || RELAIS_DEFAUT;
    if(!cle){ toast("Entrez la clé du relais"); return; }
    saveReglages({ cle, relay });
    cacheDel("req:&liste=1");
    state.view = "home"; state.mois = null;
    render();
  }
  else if(a === "clear-cache"){
    cacheVider();
    toast("Cache vidé");
    render();
  }
});

async function refresh(){
  toast("Actualisation…");
  try{
    const force = true;
    const cat = await getCatalogue(true);
    if(!state.mois){ const m = moisDisponibles(cat); state.mois = m[m.length - 1]; }
    if(state.view === "resto" && state.resto){
      const classeur = Object.keys(VILLES_VERS_CODE).find((v) => VILLES_VERS_CODE[v] === state.resto);
      const catR = cat[classeur];
      if(catR){
        const ongs = [ongletPnlMensuel(catR.onglets), catR.onglets.find((n) => norm(n) === "PNL ANNUEL")].filter(Boolean);
        await getOnglets(classeur, ongs, force);
      }
    } else {
      const os = ongletSynthese(cat, state.mois);
      const oc = ongletsClassement(cat, state.mois)[0];
      const cumul = cat.SYNTHESE.onglets.find((n) => norm(n).includes("CUMUL ANNUEL"));
      await getOnglets("SYNTHESE", [os, oc, cumul].filter(Boolean), force);
    }
    await render();
    toast("Données actualisées ✓");
  }catch(e){ toast("Échec : " + (e.message || e)); }
}

/* ============================ DÉMARRAGE ============================ */
render();
